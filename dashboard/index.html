<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - Maruthi Divine Touch</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f9fafb;
    }

    /* Header */
    .header {
      background: #111827;
      color: white;
      padding: 15px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo img {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 6px;
    }

    .logo-text {
      font-size: 18px;
      font-weight: bold;
    }

    /* Container */
    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
    }

    h1 {
      margin-bottom: 20px;
      color: #111827;
    }

    /* Cards */
    .card {
      position: relative;
      background: white;
      padding: 16px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .card p {
      margin: 6px 0;
      color: #374151;
    }

    .time {
      font-size: 12px;
      color: gray;
      margin-top: 8px;
    }

    /* Delete Button */
    .delete-btn {
      position: absolute;
      right: 15px;
      bottom: 15px;
      padding: 8px 14px;
      border: none;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .delete-btn:hover {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(220, 38, 38, 0.3);
    }

    .delete-btn:active {
      transform: scale(0.95);
    }

    /* Empty message */
    .empty {
      text-align: center;
      color: gray;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <img src="/logo.jpg" alt="logo">
      <span class="logo-text">Maruthi Divine Touch</span>
    </div>
    <span>Admin Panel</span>
  </div>

  <!-- Content -->
  <div class="container">
    <h1>Contact Messages</h1>
    <div id="messages"></div>
  </div>

  <div class="container">
    <h1>Orders</h1>
    <div id="orders"></div>
  </div>

  <!-- JS -->
  <script type="module" src="/admin.js"></script>

</body>
</html>
